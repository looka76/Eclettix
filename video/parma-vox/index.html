<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <style>
      :root {
        --paper: #ece2cc;
        --ink: #1f1a16;
        --red: #d42f26;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: var(--paper); }
      #root { position: relative; width: 100%; height: 100%; }
      #paper { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; object-fit: cover; z-index: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="10" data-width="1080" data-height="1920">
      <img id="paper" class="clip" src="assets/paper.jpg" alt="" data-start="0" data-duration="10" data-track-index="0" />
      <div id="giornale" data-composition-id="giornale" data-composition-src="compositions/giornale.html"
        data-start="0" data-duration="3.4" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index:1"></div>
      <div id="mappa" data-composition-id="mappa" data-composition-src="compositions/mappa.html"
        data-start="3.4" data-duration="3.3" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index:1"></div>
      <div id="oggi" data-composition-id="oggi" data-composition-src="compositions/oggi.html"
        data-start="6.7" data-duration="3.3" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index:1"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
